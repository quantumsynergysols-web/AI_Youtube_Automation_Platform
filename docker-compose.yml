services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ytap
      POSTGRES_PASSWORD: ytap
      POSTGRES_DB: ytap
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://ytap:ytap@postgres:5432/ytap?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["4300:4300"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://ytap:ytap@postgres:5432/ytap?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      VITE_API_URL: http://localhost:4300
    ports: ["5273:80"]
    depends_on: [api]

volumes:
  pgdata:
