<svg xmlns="http://www.w3.org/2000/svg" style="color:#11161E;background:#FFFFFF" viewBox="0 20 940 520" role="img" aria-label="Component view in six tiers. A web application sits above four application services: auth, channel manager, project orchestrator and billing. Below them the generation domain holds topic research, scriptwriter, voice synthesis, visual generation, assembly and metadata. All output passes through the Originality Guard, which gates publishing. Below that sit the publisher, analytics ingester and feedback recommender, whose output loops back up into the scriptwriter. A provider adapter layer forms the base.">
