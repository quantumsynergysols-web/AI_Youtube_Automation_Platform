      <rect x="215" y="350" width="270" height="110" rx="5" fill="currentColor" opacity="0.04"/>
      <rect x="215" y="350" width="270" height="110" rx="5" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
      <rect x="560" y="110" width="350" height="320" rx="5" fill="currentColor" opacity="0.04"/>
      <rect x="560" y="110" width="350" height="320" rx="5" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>

      <g stroke="currentColor" stroke-width="1.1" opacity="0.45" fill="currentColor" fill-opacity="0.09">
        <rect x="22"  y="150" width="168" height="58" rx="3"/>
        <rect x="240" y="135" width="220" height="50" rx="3"/>
        <rect x="240" y="205" width="220" height="42" rx="3"/>
