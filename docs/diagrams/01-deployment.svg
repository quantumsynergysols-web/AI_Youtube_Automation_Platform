<svg xmlns="http://www.w3.org/2000/svg" style="color:#11161E;background:#FFFFFF" viewBox="0 86 940 406" role="img" aria-label="Deployment view. The creator browser calls an API service running on the product's own VPS, which enqueues work to a Redis queue consumed by a Python generation worker. The VPS tier reads and writes its own PostgreSQL and object storage, and the browser fetches finished video by signed URL. The worker calls generation providers for script, narration and visuals. Separately the API service calls a third-party channel data vendor for topic research, and reserves the YouTube API for publishing and metrics only.">
      <defs>
        <marker id="dpA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
        <marker id="dpB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7C86"/>
        </marker>
      </defs>

      <g font-family="monospace" font-size="10.5" fill="currentColor" opacity="0.55" letter-spacing="1.2">
        <text x="22" y="140">CLIENT</text>
        <text x="215" y="100">OWN VPS &#183; DOCKER COMPOSE</text>
        <text x="215" y="340">OWN MANAGED DATA</text>
        <text x="560" y="100">EXTERNAL SERVICES</text>
      </g>

      <rect x="215" y="110" width="270" height="212" rx="5" fill="currentColor" opacity="0.04"/>
