        <rect x="592" y="369" width="287" height="32" rx="3"/>
        <rect x="578" y="246" width="315" height="38" rx="3"/>
      </g>

      <rect x="578" y="300" width="315" height="112" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
      <text x="586" y="316" font-family="monospace" font-size="9.5" fill="currentColor" opacity="0.5" letter-spacing="1">GENERATION PROVIDERS</text>

      <rect x="578" y="130" width="315" height="46" rx="3" fill="#0E7C86" fill-opacity="0.14" stroke="#0E7C86" stroke-width="1.2"/>
      <rect x="578" y="186" width="315" height="50" rx="3" fill="#0E7C86" fill-opacity="0.14" stroke="#0E7C86" stroke-width="1.2"/>

      <g font-size="12" fill="currentColor" text-anchor="middle">
        <text x="106" y="174">Creator browser</text>
        <text x="106" y="191" font-size="10.5" opacity="0.7">React + Vite SPA</text>
        <text x="350" y="156">API service</text>
        <text x="350" y="173" font-size="10.5" opacity="0.7">Node + Express</text>
