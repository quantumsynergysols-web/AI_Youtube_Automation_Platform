        <text x="503" y="326" text-anchor="middle">generation calls</text>
        <text x="512" y="256" text-anchor="middle">billing</text>
      </g>
      <g font-size="10.5" fill="#0E7C86" font-weight="600">
        <text x="516" y="143" text-anchor="middle">topic research</text>
        <text x="534" y="185" text-anchor="middle">publish + metrics</text>
      </g>
    </svg>