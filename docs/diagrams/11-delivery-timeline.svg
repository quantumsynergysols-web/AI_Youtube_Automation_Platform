<svg xmlns="http://www.w3.org/2000/svg" style="color:#11161E;background:#FFFFFF" viewBox="0 0 900 300" role="img" aria-label="Seventeen week delivery timeline showing seven phases with six gates, a generation quality spike in weeks two to three and pricing validation in weeks four to eight, both feeding decisions before the four-week generation core phase begins.">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- week ruler -->
      <line x1="60" y1="34" x2="860" y2="34" stroke="currentColor" stroke-width="1" opacity="0.28"/>
      <text x="60" y="22" font-size="11" fill="currentColor" opacity="0.6" font-family="monospace">W1</text>
      <text x="248" y="22" font-size="11" fill="currentColor" opacity="0.6" font-family="monospace">W5</text>
      <text x="436" y="22" font-size="11" fill="currentColor" opacity="0.6" font-family="monospace">W9</text>
      <text x="624" y="22" font-size="11" fill="currentColor" opacity="0.6" font-family="monospace">W13</text>
      <text x="812" y="22" font-size="11" fill="currentColor" opacity="0.6" font-family="monospace">W17</text>

      <!-- phase bars -->
      <g>
        <rect x="60"  y="46" width="137" height="34" rx="3" fill="currentColor" opacity="0.10"/>
        <rect x="201" y="46" width="90"  height="34" rx="3" fill="currentColor" opacity="0.10"/>
        <rect x="295" y="46" width="184" height="34" rx="3" fill="#0E7C86" opacity="0.22"/>
        <rect x="483" y="46" width="90"  height="34" rx="3" fill="currentColor" opacity="0.10"/>
        <rect x="577" y="46" width="90"  height="34" rx="3" fill="currentColor" opacity="0.10"/>
        <rect x="671" y="46" width="90"  height="34" rx="3" fill="currentColor" opacity="0.10"/>
        <rect x="765" y="46" width="94"  height="34" rx="3" fill="currentColor" opacity="0.10"/>

        <text x="128" y="68" font-size="11.5" text-anchor="middle" fill="currentColor">P0 Foundation</text>
        <text x="246" y="68" font-size="11.5" text-anchor="middle" fill="currentColor">P1 Channel</text>
        <text x="387" y="68" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">P2 Generation core</text>
        <text x="528" y="68" font-size="11.5" text-anchor="middle" fill="currentColor">P3 Metadata</text>
        <text x="622" y="68" font-size="11.5" text-anchor="middle" fill="currentColor">P4 Guard</text>
        <text x="716" y="68" font-size="11.5" text-anchor="middle" fill="currentColor">P5 Publish</text>
        <text x="812" y="68" font-size="11.5" text-anchor="middle" fill="currentColor">P6 Loop</text>
      </g>

      <!-- gates -->
      <g fill="#B0771A">
        <polygon points="201,88 208,96 201,104 194,96"/>
        <polygon points="295,88 302,96 295,104 288,96"/>
        <polygon points="483,88 490,96 483,104 476,96"/>
        <polygon points="577,88 584,96 577,104 570,96"/>
        <polygon points="671,88 678,96 671,104 664,96"/>
        <polygon points="765,88 772,96 765,104 758,96"/>
        <polygon points="859,88 866,96 859,104 852,96"/>
      </g>
      <text x="201" y="120" font-size="10" text-anchor="middle" fill="#B0771A" font-family="monospace">G0</text>
      <text x="295" y="120" font-size="10" text-anchor="middle" fill="#B0771A" font-family="monospace">G1</text>
      <text x="483" y="120" font-size="10" text-anchor="middle" fill="#B0771A" font-family="monospace">G2</text>
      <text x="577" y="120" font-size="10" text-anchor="middle" fill="#B0771A" font-family="monospace">G3</text>
      <text x="671" y="120" font-size="10" text-anchor="middle" fill="#B0771A" font-family="monospace">G4</text>
      <text x="765" y="120" font-size="10" text-anchor="middle" fill="#B0771A" font-family="monospace">G5</text>
      <text x="859" y="120" font-size="10" text-anchor="middle" fill="#B0771A" font-family="monospace">G6</text>

      <!-- parallel tracks -->
      <rect x="107" y="160" width="94" height="28" rx="3" fill="#0E7C86" opacity="0.30"/>
      <text x="154" y="178" font-size="11" text-anchor="middle" fill="currentColor">Quality spike</text>

      <rect x="201" y="212" width="235" height="28" rx="3" fill="#0E7C86" opacity="0.30"/>
      <text x="318" y="230" font-size="11" text-anchor="middle" fill="currentColor">Pricing validation, 10 creators</text>

      <!-- feedback arrows into P2 -->
      <path d="M 201 174 C 250 174, 300 150, 330 86" stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#ah)" opacity="0.75"/>
      <path d="M 436 226 C 470 226, 470 160, 420 86" stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#ah)" opacity="0.75"/>

      <text x="470" y="176" font-size="11" fill="currentColor" opacity="0.85">decides animation density</text>
      <text x="500" y="248" font-size="11" fill="currentColor" opacity="0.85">decides plan pricing before billing is built</text>

      <!-- legend -->
      <line x1="60" y1="278" x2="76" y2="278" stroke="currentColor" stroke-width="1.4" opacity="0.75" marker-end="url(#ah)"/>
      <text x="84" y="282" font-size="10.5" fill="currentColor" opacity="0.7">result feeds a decision</text>
      <polygon points="248,272 255,280 248,288 241,280" fill="#B0771A"/>
      <text x="264" y="284" font-size="10.5" fill="currentColor" opacity="0.7">phase gate: go / no-go, owned by the team lead</text>
    </svg>